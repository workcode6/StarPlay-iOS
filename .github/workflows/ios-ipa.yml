name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 注意：这个账号无法分配 macos-14（报 unsupported configuration），
    # 但 macos-latest 实测可分配（runner 1000000013 success）。
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify packaged renderer and provenance
        run: |
          npm run build
          cat www/renderer-assets.json
          du -sh www

      - name: Add iOS platform
        run: |
          if [ -d ios/App ]; then echo 'ios/App present'; else npx cap add ios; fi
          npx cap sync ios
          ls -la ios/App | head -20

      - name: Allow HTTP (ATS) + inline media
        run: |
          set -e
          PLIST=$(find ios/App -name 'Info.plist' -path '*App*' | head -1)
          echo "PLIST=$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoadsInMedia bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoadsInWebContent bool true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAllowsArbitraryLoadsInWebContent bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :NSAppTransportSecurity" "$PLIST"

      - name: Build unsigned IPA
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          BUILD_NUMBER=$(node -p "require('./package.json').buildNumber")
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= CODE_SIGN_ENTITLEMENTS= build

      - name: Package IPA
        run: |
          set -e
          APP=$(find ios/App/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo '::error::no .app produced'; find ios/App/build -name '*.app' || true; exit 1; fi
          echo "APP=$APP"
          rm -rf Payload StarPlay-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry StarPlay-unsigned.ipa Payload
          ls -lh StarPlay-unsigned.ipa
          unzip -l StarPlay-unsigned.ipa | head -15

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StarPlay-unsigned-ipa
          path: |
            StarPlay-unsigned.ipa
            www/renderer-assets.json
          retention-days: 30
          if-no-files-found: error
