name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 注意：这个账号无法分配 macos-14（报 unsupported configuration），
    # 但 macos-latest 实测可分配（runner 1000000013 success）。
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure web assets
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            printf '<!doctype html><meta charset=utf-8><title>StarPlay</title><h1>StarPlay</h1>' > www/index.html
          fi
          du -sh www

      - name: Add iOS platform
        run: |
          if [ -d ios/App ]; then echo 'ios/App present'; else npx cap add ios; fi
          npx cap sync ios
          ls -la ios/App | head -20

      - name: Build unsigned IPA
        run: |
          set -e
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= CODE_SIGN_ENTITLEMENTS= build

      - name: Package IPA
        run: |
          set -e
          APP=$(find ios/App/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then echo '::error::no .app produced'; find ios/App/build -name '*.app' || true; exit 1; fi
          echo "APP=$APP"
          rm -rf Payload StarPlay-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry StarPlay-unsigned.ipa Payload
          ls -lh StarPlay-unsigned.ipa
          unzip -l StarPlay-unsigned.ipa | head -15

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StarPlay-ipa
          path: StarPlay-unsigned.ipa
          retention-days: 30
          if-no-files-found: error