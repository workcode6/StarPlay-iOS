name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Prepare web assets
        run: |
          mkdir -p www
          if [ -d "web-dist" ]; then cp -R web-dist/. www/; fi
          if [ ! -f "www/index.html" ]; then
            echo '<!doctype html><meta charset="utf-8"><title>StarPlay</title><h1>StarPlay</h1><p>web assets missing</p>' > www/index.html
          fi
          ls -la www | head -20

      - name: Add iOS platform
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build unsigned IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build | xcpretty || xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Package IPA
        run: |
          set -e
          APP=$(find ios/App/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry StarPlay-unsigned.ipa Payload
          ls -lh StarPlay-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StarPlay-ipa
          path: StarPlay-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
